<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas Dinámicas</title>

    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

    <header class="header">
        <button class="btn-primary" onclick="generarTablas()">
            PROBAR
        </button>
    </header>
    <main class="main">
        <div class="card">
            <h1>Tablas de Multiplicar</h1>
            <p class="descripcion">
                Escribe un número para generar su tabla de multiplicar.
            </p>
            <input 
                type="number"
                id="numero"
                placeholder="Escribe un número"
                class="caja"
            >
            <div id="contenedorTabla">
                <table class="tabla">
                    <tr>
                        <td>3 x 1</td>
                        <td>=</td>
                        <td>3</td>
                    </tr>

                    <tr>
                        <td>3 x 2</td>
                        <td>=</td>
                        <td>6</td>
                    </tr>

                    <tr>
                        <td>3 x 3</td>
                        <td>=</td>
                        <td>9</td>
                    </tr>

                    <tr>
                        <td>3 x 4</td>
                        <td>=</td>
                        <td>12</td>
                    </tr>

                    <tr>
                        <td>3 x 5</td>
                        <td>=</td>
                        <td>15</td>
                    </tr>

                    <tr>
                        <td>3 x 6</td>
                        <td>=</td>
                        <td>18</td>
                    </tr>

                    <tr>
                        <td>3 x 7</td>
                        <td>=</td>
                        <td>21</td>
                    </tr>

                    <tr>
                        <td>3 x 8</td>
                        <td>=</td>
                        <td>24</td>
                    </tr>

                    <tr>
                        <td>3 x 9</td>
                        <td>=</td>
                        <td>27</td>
                    </tr>

                    <tr>
                        <td>3 x 10</td>
                        <td>=</td>
                        <td>30</td>
                    </tr>
                </table>
            </div>
        </div>
    </main>
    <footer class="footer">
        Creado por: Evelyn
    </footer>
    <script src="multiplicar.js"></script>
</body>
</html>
